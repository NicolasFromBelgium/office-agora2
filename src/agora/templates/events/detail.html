{% extends "base.html" %}
{% block title %}{{ event.title }} · {{ project.name }}{% endblock %}
{% block content %}
{% include "projects/_header.html" %}
<div class="mx-auto grid max-w-7xl gap-6 px-4 py-6 lg:grid-cols-3">
  <section class="lg:col-span-2">
    <form method="post" action="{{ u('/projects/' ~ project.id ~ '/events/' ~ event.id) }}" class="compose-issue">
      <div class="compose-main">
        <p class="compose-kicker">Événement</p>
        <label for="event-title" class="compose-label">Résumé</label>
        <input id="event-title" name="title" required value="{{ event.title }}" class="compose-summary" />
        <label for="event-description" class="compose-label">Description</label>
        <textarea id="event-description" name="description" rows="8" class="compose-notes">{{ event.description }}</textarea>
      </div>
      <aside class="compose-side">
        <label class="compose-check">
          <input type="checkbox" name="all_day" value="on" {% if event.all_day %}checked{% endif %} />
          Journée entière
        </label>
        <div>
          <label for="start_date" class="compose-label">Début</label>
          <input id="start_date" name="start_date" type="date" required value="{{ start_date }}" class="compose-field" />
        </div>
        <div>
          <label for="start_time" class="compose-label">Heure de début</label>
          <input id="start_time" name="start_time" type="time" value="{{ start_time }}" class="compose-field" />
        </div>
        <div>
          <label for="end_date" class="compose-label">Fin</label>
          <input id="end_date" name="end_date" type="date" value="{{ end_date }}" class="compose-field" />
        </div>
        <div>
          <label for="end_time" class="compose-label">Heure de fin</label>
          <input id="end_time" name="end_time" type="time" value="{{ end_time }}" class="compose-field" />
        </div>
        <p class="text-xs text-muted">Créé par {{ event.created_by.display_name if event.created_by else "—" }}</p>
        <button type="submit" class="compose-submit w-full">Enregistrer</button>
      </aside>
    </form>
    <form
      method="post"
      action="{{ u('/projects/' ~ project.id ~ '/events/' ~ event.id ~ '/delete') }}"
      class="mt-3"
      onsubmit="return confirm('Supprimer cet événement ?');"
    >
      <input type="hidden" name="next" value="/projects/{{ project.id }}/agenda" />
      <button type="submit" class="danger-link">Supprimer l’événement</button>
    </form>
  </section>
</div>
{% endblock %}
