<form
  method="post"
  action="{{ u(action) }}"
  class="like-form"
  hx-post="{{ u(action) }}"
  hx-swap="outerHTML"
  hx-target="this"
  @mousedown.stop
>
  <button
    type="submit"
    class="like-btn{% if liked %} like-btn-on{% endif %}"
    aria-pressed="{{ 'true' if liked else 'false' }}"
    aria-label="{% if liked %}Retirer le j’aime{% else %}J’aime{% endif %}"
    title="{% if names %}{{ names|join(', ') }}{% elif liked %}Retirer{% else %}J’aime{% endif %}"
  >
    <svg class="like-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 21s-6.2-4.35-9.33-8.22C.8 10.4 1.2 6.7 4.05 5.15 6.1 4.04 8.62 4.7 10 6.4c1.38-1.7 3.9-2.36 5.95-1.25 2.85 1.55 3.25 5.25 1.38 7.63C18.2 16.65 12 21 12 21z" />
    </svg>
    {% if count %}<span class="like-count">{{ count }}</span>{% endif %}
  </button>
</form>
