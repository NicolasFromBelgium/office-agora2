[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-agora"
version = "0.1.0"
description = "Lean internal project workspace for a small team."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "NicolasFromBelgium" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx2>=2.0",
]

[project.scripts]
office-agora = "agora.__main__:main"
office-agora-brief = "agora.brief:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agora = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers --tb=short"
filterwarnings = [
    "error",
    # Starlette TestClient still references anyio.abc.BlockingPortal.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.coverage.run]
source = ["agora"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
